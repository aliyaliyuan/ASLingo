<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display Webcam</title>

<style>
#container {
    margin: 0px auto;
    width: 500px;
    height: 375px;
    border: 10px #333 solid;
}

#videoElement {
    width: 500px;
    height: 375px;
    background-color: #666;
    transform: scaleX(-1);
}
</style>
</head>

<body style="background-color:#fdc1d6">
<body>
<img src="/static/logo.jpg" alt="ASLingo Logo" style="width: 200px;">
<h1 id="prediction">Letter: </h1>

<div id="container">
    <video autoplay="true" id="videoElement"></video>
</div>

<script>
var video = document.querySelector('#videoElement');

if (navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({video: true})
        .then(function(stream) {
            video.srcObject = stream;
        })
        .catch(function(error) {
            console.log("Something's not right...", error);
        });
}

// Capture and predict function
function captureAndPredict() {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    canvas.toBlob(function(blob) {
        const formData = new FormData();
        formData.append('image', blob);
        
        fetch('/predict', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            console.log('Prediction:', data.letter);
            document.getElementById('prediction').textContent = 'Letter: ' + data.letter;
        })
        .catch(error => console.error('Error:', error));
    }, 'image/jpeg');
}

// Predict every second
setInterval(captureAndPredict, 1000);
</script>
</body>
</html>
