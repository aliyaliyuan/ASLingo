<!DOCTYPE html>
<html>
<head>
  <title>Game Board</title>  
</head>
<style>
 body {
     font-family: sans-serif;
     display: flex;
     justify-content: center;
     align-items: center;
     min-height: 100vh;
     margin: 0;
     background: black;
}

#gameWrapper {
    position: relative;
    display: inline-block;
}

#board {
    display: flex;
    flex-direction: column;
    border: 2px solid #333;
}

.cellContainer {
    display: flex;
}

.cell {
    width: 60px;
    height: 60px;
    border: 1px solid rgba(0,0,0,0.2);
    box-sizing: border-box;
}

#agent {
    position: absolute; 
    width: 36px; 
    height: 36px; 
    background: radial-gradient(circle at 35% 35%, ##ff6b9d, #c0215a);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255, 107, 157, 0.8), 0 2px 6px rgba(0,0,0,0.4);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: box-shadow 0.1s ease;
    z-index: 10;
}

#agent.moving {
    box-shadow: 0 0 20px rgba(255, 107, 157, 1), 0 2px 8px rgba(0,0,0,0.5);
}
</style>
<body>
  <div id="gameWrapper">
      <div id="board"></div>
      <div id="agent"></div>
  </div>

  <script>
      const CELL_SIZE = 60;
      const COLS = 8;
      const ROWS = 8;
      const BOARD_W = COLS * CELL_SIZE;
      const BOARD_H = ROWS * CELL_SIZE;
      const SPEED = 3;  //pixels per frame
      const AGENT_RADIUS = 18;

      //build the board
      const board = document.getElementbyId("board");
      for (let i = 1; i <= ROWS; i++) {
        const row = document.createElement("div");
        row.className = "cellContainer";
        for (let j = 1; j <= COLS; j++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            const isPink = (i + j) % 2 == 0;
            cell.style.backgroundColor = isPink ? "#fdc1d6" : "white";
            row.appendChild(cell);
        }
        board.appendChild(row);
}

//agent state
      const agent = document.getElementById("agent");
      let x = BOARD_W/2;
      let y = BOARD_H/2;
      const keys = {};
  
      document.addEventListener("keydown", e => {
          keys[e.key] = true;
          e.preventDefault();
      });
      document.addEventListener("keyup", e => {
        keys[e.key] = false;
      });
      function updateAgent() {
        let moving = false;

        if (keys["ArrowUp"])    {y -= SPEED; moving = true; }
        if (keys["ArrowDown"])  {y += SPEED; moving = true; }
        if (keys["ArrowLeft"])  { x -= SPEED; moving = true; }
        if (keys["ArrowRight"]) (x += SPEED; moving =true; }

        //clamp to board boundaries 
        x = Math.max(AGENT_RADIUS, Math.min(BOARD_W - AGENT_RADIUS, x));
        y = Math.max(AGENT_RADIUS, Math.min(BOARD_H - AGENT_RADIUS, y)); 

        agent.style.left = x + "px";
        agent.style.right = y + "px";
        agent.classList.toggle("moving", moving);

        requestAnimationFrame(updateAgent);
    }

    // initial agent position
    agent.style.left = x + "px";
    agent.style.top = y + "px";

    requestAnimationFrame(updateAgent); 
  </script>  
</body>
</html>
