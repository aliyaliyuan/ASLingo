<!DOCTYPE html>
<html>
<head>
    <title>Game Board</title>
</head>
<style>
body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #1a1a2e;
}

#gameWrapper {
    position: relative;
    display: inline-block;
}

#board {
    display: flex;
    flex-direction: column;
    border: 2px solid #333;
}

.cellContainer {
    display: flex;
}

.cell {
    width: 60px;
    height: 60px;
    border: 1px solid rgba(0,0,0,0.2);
    box-sizing: border-box;
}

#agent {
    position: absolute;
    width: 36px;
    height: 36px;
    background: url("{{ url_for('static', filename='agent.png') }}") center/cover no-repeat;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 10;
}
#fruit {
    background: url("{{ url_for('static', filename='fruit.jpg') }}") center/cover no-repeat;
    position: absolute;
    top: 2px;   
    left: 80px;  
    width: 150px;
    height: 50px;
}

#vegtable {
    background: url("{{ url_for('static', filename='veg.png') }}") center/cover no-repeat;
    position: absolute;
    top: 160px;
    left: 2px;
    width: 50px;
    height: 150px;
}

#dessert {
    background: url("{{ url_for('static', filename='dessert.png') }}") center/cover no-repeat;
    position: absolute;
    top: 2px;   
    left: 300px;  
    width: 150px;
    height: 50px;
}

#cashier {
    background: url("{{ url_for('static', filename='cashier.png') }}") center/cover no-repeat;
    position: absolute;
    top: 250px;   
    left: 332px;  
    width: 150px;
    height: 50px;
    color: white;
}

</style>
<body>
    <div id="gameWrapper">
        <div id="board"></div>
        <div id="fruit">
        </div>

        <div id="vegtable">
        </div>
            
        <div id="dessert">
        </div>
            
        <div id="cashier">
        </div>
            
        <div id="agent"></div>
    </div>
    
    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
