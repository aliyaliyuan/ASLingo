<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ASLingo - Menu</title>

<style>
body {
    background-color: #fdc1d6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
}

#logo {
    width: 300px;
    margin-bottom: 40px;
}

.button {
    display: block;
    width: 250px;
    padding: 20px;
    margin: 15px;
    background-color: white;
    color: #333;
    text-align: center;
    text-decoration: none;
    border-radius: 25px;
    font-size: 20px;
    font-weight: bold;
    border: 2px solid #333;
}

.button:hover {
    background-color: #333;
    color: white;
}
</style>
</head>

<body>
<img id="logo" src="/static/logo_fdc1d6.jpg" alt="ASLingo Logo">

<h2>Choose a Mode:</h2>

<a href="/flashcards" class="button"> Flashcards</a>
<a href="/app" class="button"> Live Recognition</a>
<a href="/game" class="button"> Game</a>

</body>
</html>
